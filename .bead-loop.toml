# bead-loop (github.com/imkarrer/bead-loop): which beads the loop works here and
# how a worktree is proven. Stages, lanes and research come from the global
# ~/.config/bead-loop/config.toml. The gate is CI's job verbatim, so a
# worktree that passes it is one CI would pass.
label = "delegate:local"
base = "main"
gate = "nix develop -c scripts/check.sh"
merge = "auto"                       # the watcher squash-merges once `check` is green
