# Pages CMS (https://pagescms.org): the forms club editors fill in at
# https://app.pagescms.org. Every field mirrors docs/content-model.md, key for
# key; a change to one is a change to the other and to the template that reads
# it. Uploads are stored without a leading slash ("images/news/x.jpg") so
# templates can pass them through relURL.

media:
  - name: images
    label: Images
    input: static/images
    output: images
    rename: safe
    categories: [image]
  - name: results
    label: Results files
    input: static/results
    output: results
    rename: safe
    extensions: [pdf, html, htm, csv, xlsx]

content:
  # ── Club-wide facts ─────────────────────────────────────────────────────
  - name: club
    label: Club info & next meeting
    type: file
    path: data/club.yml
    format: yaml
    fields:
      - name: name
        label: Club name
        type: string
        required: true
      - name: tagline
        label: Tagline (one line under the name on the home page)
        type: string
      - name: email
        label: Contact email
        type: string
        description: Shown on Contact. Without a signup link below, people join the mailing list by emailing it.
      - name: hero_photo_credit
        label: Header photo credit (photographer's name)
        type: string
      - name: hero_photo_credit_url
        label: Header photo credit link
        type: string
      - name: mailing_list_url
        label: Mailing list signup link (optional)
        type: string
        description: A Google Group or signup form. Leave empty to have people email the club instead.
      - name: tax_status
        label: Tax status (shown on the Sponsors page)
        type: string
        description: e.g. 501(c)(7). The page also says the club is not a 501(c)(3).
      - name: discord_invite
        label: Discord invite link
        type: string
        description: The permanent invite, e.g. https://discord.gg/...
      - name: media_form_url
        label: Video submission form link
        type: string
        description: The Google Form members use to send in videos. Empty shows "Submissions open soon".
      - name: next_meeting
        label: Next meeting
        type: object
        description: Leave the date empty (or let it pass) and the site says "date TBA".
        fields:
          - name: date
            label: Date
            type: date
            default: ""
            options:
              format: yyyy-MM-dd
          - name: time
            label: Time
            type: string
            description: e.g. 7:00 pm
          - name: venue
            label: Venue
            type: string
          - name: address
            label: Address
            type: string
          - name: map_url
            label: Map link
            type: string
          - name: notes
            label: Notes (one line)
            type: string

  - name: socials
    label: Social links
    type: file
    path: data/socials.yml
    format: yaml
    list: true
    fields:
      - name: name
        label: Platform
        type: select
        required: true
        options:
          values: [facebook, discord, youtube, instagram, tiktok, reddit]
      - name: url
        label: Link
        type: string
        description: Leave empty to hide this platform.
      - name: label
        label: Name to show (e.g. Facebook group)
        type: string
      - name: blurb
        label: One line for the home page's Find us section (optional)
        type: string

  - name: sponsors
    label: Sponsors
    type: file
    path: data/sponsors.yml
    format: yaml
    list: true
    fields:
      - name: name
        label: Sponsor name
        type: string
        required: true
      - name: url
        label: Website
        type: string
        description: The site adds referral tracking to this link automatically.
      - name: logo
        label: Logo
        type: image
        options:
          media: images
          path: static/images/sponsors
      - name: lane
        label: Lane
        type: select
        default: club
        description: club = backs the whole season. event = backs one event.
        options:
          values: [club, event]
      - name: tier
        label: Tier
        type: select
        description: Club lane - title, gold or supporter. Event lane - presenting, event or in-kind.
        options:
          values: [title, gold, supporter, presenting, event, in-kind]
      - name: event
        label: Event (event lane only)
        type: string
        description: The event entry's file name without .md; the sponsor also shows on that event's page.
      - name: event_label
        label: Event name to group under (event lane only)
        type: string
        description: e.g. 2027 CVTC Autocross
      - name: offer
        label: Member offer
        type: string
        description: e.g. 10% off parts for members
      - name: code
        label: Discount or referral code
        type: string
      - name: blurb
        label: About them (one or two sentences)
        type: text

  - name: clubs
    label: Clubs near us
    type: file
    path: data/clubs.yml
    format: yaml
    list: true
    fields:
      - name: name
        label: Club name
        type: string
        required: true
      - name: url
        label: Website
        type: string
      - name: area
        label: Where they're based
        type: string
      - name: runs
        label: What they run (e.g. Autocross)
        type: string
      - name: where
        label: Venues or series (one line)
        type: string
      - name: note
        label: Extra note (optional)
        type: string

  # ── Calendar, results, news ─────────────────────────────────────────────
  - name: events
    label: Events
    type: collection
    path: content/events
    format: yaml-frontmatter
    exclude: [_index.md]
    filename: "{fields.date}-{primary}.md"
    view:
      fields: [title, date, event_type, location]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Event name
        type: string
        required: true
      - name: date
        label: Event date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: end_date
        label: Last day (multi-day events only)
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: event_type
        label: Type
        type: select
        required: true
        options:
          values: [autocross, track, drag, rally, social, meeting, sim]
      - name: venue
        label: Venue (if it's one the site knows)
        type: select
        options:
          values: [rock-falls-raceway]
      - name: location
        label: Location (optional when a venue is picked)
        type: string
      - name: host
        label: Hosted by (only when another club or track runs it)
        type: string
        description: e.g. Rock Falls Raceway, for a club outing to a Test & Tune
      - name: register_url
        label: Registration link (MotorsportReg, Facebook event...)
        type: string
      - name: summary
        label: One-line summary
        type: string
      - name: results
        label: Results page (fill in after the event)
        type: string
        description: The results entry's file name without .md, e.g. 2027-05-15-cvtc-autocross. The event page links to it.
      - name: announce
        label: Announce on Discord, Slack and Facebook
        type: boolean
        default: false
        description: Tick to post this once, with a link, after the site updates. Only ticked items are ever announced.
      - name: announce_text
        label: Announcement wording (optional)
        type: text
        description: "What the post says. Empty: the title and summary."
      - name: body
        label: Details
        type: rich-text
        options:
          format: markdown

  - name: results
    label: Results
    type: collection
    path: content/results
    format: yaml-frontmatter
    exclude: [_index.md]
    filename: "{fields.date}-{primary}.md"
    view:
      fields: [title, date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: e.g. 2027 CVTC Autocross
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: event
        label: Event
        type: string
        description: The event entry's file name without .md, e.g. 2027-05-15-cvtc-autocross. The results page links back to it.
      - name: results_file
        label: Full results file (PDF or HTML from the timing software)
        type: file
        description: Upload AXWare's "Final Raw Time Results" PDF and save; the tables, top ten, summary and the event's results link fill in on their own a few minutes later.
        options:
          media: results
      - name: results_url
        label: Or a link to results hosted elsewhere
        type: string
      - name: summary
        label: One-line summary
        type: string
        description: Leave empty to have it written from the results.
      - name: highlights
        label: Top ten on PAX
        description: Filled in from the timing data; no need to type it.
        type: object
        list: true
        fields:
          - name: class
            label: Class
            type: string
          - name: place
            label: Place
            type: number
          - name: driver
            label: Driver
            type: string
          - name: car
            label: Car
            type: string
          - name: time
            label: Time
            type: string
      - name: announce
        label: Announce on Discord, Slack and Facebook
        type: boolean
        default: false
        description: Tick to post this once, with a link, after the site updates. Only ticked items are ever announced.
      - name: announce_text
        label: Announcement wording (optional)
        type: text
        description: "What the post says. Empty: the title and summary."
      - name: body
        label: Write-up
        type: rich-text
        options:
          format: markdown

  - name: news
    label: News
    type: collection
    path: content/news
    format: yaml-frontmatter
    exclude: [_index.md]
    filename: "{fields.date}-{primary}.md"
    view:
      fields: [title, date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Headline
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: summary
        label: One-line summary
        type: string
      - name: image
        label: Image
        type: image
        options:
          media: images
          path: static/images/news
      - name: announce
        label: Announce on Discord, Slack and Facebook
        type: boolean
        default: false
        description: Tick to post this once, with a link, after the site updates. Only ticked items are ever announced.
      - name: announce_text
        label: Announcement wording (optional)
        type: text
        description: "What the post says. Empty: the title and summary."
      - name: body
        label: Post
        type: rich-text
        options:
          format: markdown

  # ── Plain pages: About, Join, Contact, Submit, Privacy, Terms, Sponsors ──
  - name: pages
    label: Pages
    type: collection
    path: content
    format: yaml-frontmatter
    subfolders: false
    exclude: [_index.md]
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: layout
        type: string
        hidden: true
      - name: review
        label: Draft note (shows a "for club review" banner; clear it once decided)
        type: text
      - name: body
        label: Page text
        type: rich-text
        options:
          format: markdown
