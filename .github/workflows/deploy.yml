# Publish main to GitHub Pages. Also daily, because "upcoming events" and
# "next meeting" are decided at build time and go stale at midnight.
name: deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 6 * * *"   # 01:15 Central (CDT)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - id: pages
        uses: actions/configure-pages@v5
      - run: nix develop -c hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
