# Publish main to GitHub Pages. Also daily, because "upcoming events" and
# "next meeting" are decided at build time and go stale at midnight.
name: deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 6 * * *"   # 01:15 Central (CDT)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flox/install-flox-action@v2
      - id: pages
        uses: actions/configure-pages@v5
      - uses: flox/activate-action@v2
        with:
          command: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Announce what editors ticked (fanout.json): every deploy reads the live
  # /announce.json and posts each newly ticked item to the enabled targets,
  # recording deliveries on the fanout-ledger branch so nothing posts twice.
  # A dry run (it only prints) until the repo variable FANOUT_LIVE is "true".
  announce:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: announce
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the ledger branch
        run: git worktree add fanout-ledger origin/fanout-ledger
      # fanout runs from its own repo at a pinned commit, inside that repo's
      # Flox environment (Node from the public catalog). Not `flox install
      # imkarrer/fanout`: FloxHub requires a login to download custom packages.
      - uses: actions/checkout@v4
        with:
          repository: imkarrer/fanout
          ref: 46c6ab6ee2e6ba0e4a3e6440fc21c92a37f43ed4  # v0.1.0
          path: fanout-src
      - uses: flox/install-flox-action@v2
      - uses: flox/activate-action@v2
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        with:
          dir: fanout-src
          command: node --no-warnings fanout-src/src/cli.ts run --config fanout.json ${{ vars.FANOUT_LIVE == 'true' && '--live' || '' }}
      - name: Record deliveries on the ledger branch
        if: always()
        working-directory: fanout-ledger
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="cvscc-announce" -c user.email="actions@github.com" commit -q -m "fanout: deliveries from ${GITHUB_SHA::7}"
          git push origin HEAD:fanout-ledger
