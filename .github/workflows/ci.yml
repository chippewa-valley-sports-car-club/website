# The check on every pull request and push. Its job name, `check`, is the
# required status on main and what the bead loop waits for before it merges.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flox/install-flox-action@v2
      - uses: flox/activate-action@v2
        with:
          command: scripts/check.sh
