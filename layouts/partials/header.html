<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <img src="{{ "images/logo.png" | relURL }}" alt="" width="44" height="44">
      <span class="brand-text"><span class="brand-short">CVSCC</span><span class="brand-long">{{ hugo.Data.club.name }}</span></span>
    </a>
    <nav aria-label="Main">
      {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
  </div>
  <div class="checker" aria-hidden="true"></div>
</header>
