{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<div class="card-grid community-grid">
  {{- range .Pages.ByWeight }}
  <a class="card card-link" href="{{ .RelPermalink }}">
    <h2>{{ .Title }}</h2>
    {{ with .Params.summary }}<p>{{ . }}</p>{{ end }}
    <p class="card-more">Read more →</p>
  </a>
  {{- end }}
</div>
{{ end }}
