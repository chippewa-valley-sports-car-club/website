# Other clubs near the Chippewa Valley, shown on /community/nearby-clubs/.
# docs/content-model.md. Checked 2026-10-23.
- name: Minnesota Autosports Club (MAC)
  url: https://mnautox.com/
  area: Twin Cities, MN
  runs: Autocross
  where: The MOWOG series at the Minnesota State Fairgrounds, Canterbury Park and Dakota County Technical College.
  note: Took over the Met Council's work in 2023, the series the club's own autocrosses have run in.
- name: Corvettes of Minnesota (COM)
  url: https://corvettesofmn.com/
  area: Twin Cities, MN
  runs: Autocross, rally and car shows
  where: Met Council and NCCC autocrosses, the all-GM car show at the State Fairgrounds every June, and an NCCC rally late each summer.
  note: Founded in 1960, the same year this club incorporated, and a long-time Met Council club like us.
- name: Sports Car Club of La Crosse (SCCLaC)
  url: https://www.scclac.org/
  area: La Crosse, WI
  runs: Autocross
  where: SCCA autocross at Minnesota State College Southeast Tech in Winona, MN, part of the Land O'Lakes Region championship.
  note: Founded in 1957, the same era as this club.
- name: Fox Valley Sports Car Club (FVSCC)
  url: https://www.fvscc.com/
  area: Fox Valley, WI
  runs: Autocross
  where: The Road America AutoCross Series on the Motorplex at Road America, Plymouth, WI.
- name: Central Wisconsin Sports Car Club (CWSCC)
  url: https://sites.google.com/view/cwscc/
  area: Wisconsin Rapids, WI
  runs: Autocross and more
  where: Autocross at Golden Sands Speedway, including the fall Spookycross.
- name: Milwaukee Region SCCA
  url: https://www.motorsportreg.com/calendar/?q=Milwaukee%20Region%20SCCA
  area: Southeast Wisconsin
  runs: Autocross
  where: SCCA autocross at Road America's Motorplex, Madison College in Columbus, the Alliant Energy Center and the Waukesha Expo Center.
  note: The link shows their events on MotorsportReg.
